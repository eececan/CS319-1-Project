<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Profile</title>

    <!-- Bootstrap Core and vendor -->
    <link th:href="@{/assets/plugins/bootstrap/css/bootstrap.min.css}" rel="stylesheet">
    <!-- Core css -->
    <link th:href="@{/assets/css/main.css}" rel="stylesheet">
    <link th:href="@{/assets/css/theme1.css}" rel="stylesheet">

    <!-- Custom Alert Style -->
    <style>
        .alert-success {
            background-color: #28a745;
            color: #fff;
            border-color: #28a745;
        }
        .alert-success .btn-close {
            color: #fff;
            opacity: 1;
        }
    </style>
</head>

<body class="font-montserrat">
<div id="main_content">

    <!-- Header -->
    <div id="header_top" class="header_top">
        <div class="container">
            <div class="hleft">
                <a th:href="@{/calender}" class="nav-link icon app_inbox xs-hide"><i class="fa fa-calendar"></i></a>
                <a th:href="@{/ui/UserProfile/profile}" class="nav-link icon xs-hide"><i class="fa fa-id-card-o"></i></a>
            </div>
            <div class="hright">
                <a href="javascript:void(0)" class="nav-link icon menu_toggle"><i class="fa fa-align-left"></i></a>
            </div>
        </div>
    </div>

    <!-- Page -->
    <div class="page">
        <div class="container-fluid">
            <div class="row clearfix">
                <!-- Left Sidebar Profile Card -->
                <div class="col-lg-4 col-md-12">
                    <div class="card">
                        <img class="card-img-top"
                             th:src="${user.picture != null ? user.picture : '/assets/images/default-avatar.png'}"
                             alt="Profile Image">
                        <ul class="list-group list-group-flush">
                            <li class="list-group-item" th:text="${user.firstName + ' ' + user.lastName}"></li>
                            <li class="list-group-item">Head Secretary</li>
                            <li class="list-group-item" th:text="${user.email}"></li>
                            <li class="list-group-item" th:text="${user.phoneNumber}"></li>
                        </ul>
                    </div>
                </div>

                <!-- Profile Edit Section -->
                <div class="col-lg-8 col-md-12">
                    <div class="card">
                        <div class="card-header d-flex justify-content-between align-items-center">
                            <h3 class="card-title mb-0">Edit Profile</h3>
                            <a th:href="@{/ui/UserProfile/changePassword}" class="btn btn-sm btn-primary">Change Password</a>
                        </div>

                        <div th:if="${successMessage != null and successMessage != ''}"
                             class="alert alert-success alert-dismissible fade show" role="alert">
                            <span th:text="${successMessage}"></span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>
                        <!-- Profile Form -->
                        <form th:action="@{/ui/UserProfile/update}" method="post" th:object="${user}">
                            <div class="card-body">
                                <div class="row clearfix">
                                    <div class="col-md-6">
                                        <div class="form-group">
                                            <label>First Name</label>
                                            <input type="text" class="form-control" th:field="*{firstName}" placeholder="First Name">
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="form-group">
                                            <label>Last Name</label>
                                            <input type="text" class="form-control" th:field="*{lastName}" placeholder="Last Name">
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="form-group">
                                            <label>Bilkent ID</label>
                                            <input type="text" class="form-control" th:field="*{id}" readonly>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="form-group">
                                            <label>Start Date</label>
                                            <input type="text" class="form-control" th:field="${#dates.format(user.startDate, 'dd MMMM yyyy')}" readonly>
                                        </div>
                                    </div>

                                    <div class="col-md-6">
                                        <div class="form-group">
                                            <label>Email Address</label>
                                            <input type="email" class="form-control" th:field="*{email}" placeholder="Email">
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="form-group">
                                            <label>Phone Number</label>
                                            <input type="text" class="form-control" th:field="*{phoneNumber}" placeholder="Phone Number">
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Buttons -->
                            <div class="card-footer text-right">
                                <button type="submit" class="btn btn-primary">Update Profile</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Scripts -->
<script th:src="@{/assets/bundles/lib.vendor.bundle.js}"></script>
<script th:src="@{/assets/js/core.js}"></script>
</body>
</html>
