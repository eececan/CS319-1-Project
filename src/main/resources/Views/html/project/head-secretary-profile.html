<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Profile</title>

    <!-- Bootstrap Core and vendor -->
    <link th:href="@{/assets/plugins/bootstrap/css/bootstrap.min.css}" rel="stylesheet">
    <!-- Core css -->
    <link th:href="@{/assets/css/main.css}" rel="stylesheet">
    <link th:href="@{/assets/css/theme1.css}" rel="stylesheet">

    <!-- Custom Alert Style -->
    <style>
        .alert-success {
            background-color: #28a745;
            color: #fff;
            border-color: #28a745;
        }
        .alert-success .btn-close {
            color: #fff;
            opacity: 1;
        }
        .signout-link {
            color: white; /* Match navbar background */
            text-decoration: none; /* Remove underline */
            margin-left: 15px; /* Add space from notification icon */
            font-size: 16px; /* Adjust text size for better appearance */
            display: flex; /* Ensures proper alignment */
            align-items: center; /* Align icon and text vertically */
        }

        .signout-link:hover {
            color: #007bff; /* Change to primary blue on hover */
            text-decoration: underline; /* Add underline on hover */
        }
    </style>
</head>

<body class="font-montserrat">
<div id="main_content">

    <!-- Header -->
    <div id="header_top" class="header_top">
        <div class="container">
            <div class="hleft">
                <div class="dropdown">
                    <img class="avatar" th:src="@{/bilkent.png}" alt="User Avatar"
                         style="width: 40px; height: 40px; border-radius: 50%; margin-top:5px;">
                </div>
            </div>
            <div class="hright">
                <div class="dropdown">
                    <a href="javascript:void(0)" class="nav-link icon menu_toggle"><i class="fa  fa-align-left"></i></a>
                </div>
            </div>
        </div>
    </div>

    <div id="left-sidebar" class="sidebar ">
        <h5 class="brand-name"
            style="font-weight: bold; margin-left: 5px; font-size: 18px; margin-top: 10px;">
            <span th:if="${role == 'ROLE_GUIDE'}">Guide</span>
            <span th:if="${role == 'ROLE_GUIDE_IN_TRAINING'}">Guide in Training</span>
            <span th:if="${role == 'ROLE_ADVISOR'}">Advisor</span>
            <span th:if="${role == 'ROLE_COORDINATOR'}">Coordinator</span>
            <span th:if="${role == 'ROLE_HEAD_SECRETARY'}">Head Secretary</span>
            <span th:if="${role == 'ROLE_DIRECTOR'}">Director</span>
        </h5>

        <nav id="left-sidebar-nav" class="sidebar-nav">
            <ul class="metismenu">
                <li class="g_heading"></li>
                <li class="active">
                    <a th:href="@{/dashboard}">
                        <i class="fa fa-dashboard"></i><span>Dashboard</span>
                    </a>
                </li>
                <li>
                    <a th:href="@{/getAllUsers}">
                        <i class="fa fa-user"></i><span>Members</span>
                    </a>
                </li>
                <li>
                <li>
                    <a th:href="@{/getIncidentReports}">
                        <i class="fa fa-user"></i><span>Incident Reports</span>
                    </a>
                <li>
                    <a th:href="@{/ui/task/todo}">
                        <i class="fa fa-check-square-o"></i><span>Todo List</span>
                    </a>
                </li>
                <li>
                    <a th:href="@{/calendar}">
                        <i class="fa fa-calendar"></i><span>Calendar</span>
                    </a>
                </li>
                <li>
                    <a th:href="@{/ui/UserProfile/profile}">
                        <i class="fa fa-user"></i><span>My profile</span>
                    </a>
                </li>
            </ul>
        </nav>
    </div>

    <!-- Page -->
    <div class="page">
        <div class="container-fluid">
            <div class="row clearfix">
                <!-- Left Sidebar Profile Card -->
                <div class="col-lg-4 col-md-12">
                    <div class="card">
                        <img class="card-img-top"
                             th:src="${user.picture != null ? user.picture : '/assets/images/default-avatar.png'}"
                             alt="Profile Image">
                        <ul class="list-group list-group-flush">
                            <li class="list-group-item" th:text="${user.firstName + ' ' + user.lastName}"></li>
                            <li class="list-group-item">Head Secretary</li>
                            <li class="list-group-item" th:text="${user.email}"></li>
                            <li class="list-group-item" th:text="${user.phoneNumber}"></li>
                        </ul>
                    </div>
                </div>

                <!-- Profile Edit Section -->
                <div class="col-lg-8 col-md-12">
                    <div class="card">
                        <div class="card-header d-flex justify-content-between align-items-center">
                            <h3 class="card-title mb-0">Edit Profile</h3>
                            <a th:href="@{/ui/UserProfile/changePassword}" class="btn btn-sm btn-primary">Change Password</a>
                        </div>

                        <div th:if="${successMessage != null and successMessage != ''}"
                             class="alert alert-success alert-dismissible fade show" role="alert">
                            <span th:text="${successMessage}"></span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>
                        <!-- Profile Form -->
                        <form th:action="@{/ui/UserProfile/update}" method="post" th:object="${user}">
                            <div class="card-body">
                                <div class="row clearfix">
                                    <div class="col-md-6">
                                        <div class="form-group">
                                            <label>First Name</label>
                                            <input type="text" class="form-control" th:field="*{firstName}" placeholder="First Name">
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="form-group">
                                            <label>Last Name</label>
                                            <input type="text" class="form-control" th:field="*{lastName}" placeholder="Last Name">
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="form-group">
                                            <label>Bilkent ID</label>
                                            <input type="text" class="form-control" th:field="*{id}" readonly>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="form-group">
                                            <label>Start Date</label>
                                            <input type="text" class="form-control" th:field="${#dates.format(user.startDate, 'dd MMMM yyyy')}" readonly>
                                        </div>
                                    </div>

                                    <div class="col-md-6">
                                        <div class="form-group">
                                            <label>Email Address</label>
                                            <input type="email" class="form-control" th:field="*{email}" placeholder="Email">
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="form-group">
                                            <label>Phone Number</label>
                                            <input type="text" class="form-control" th:field="*{phoneNumber}" placeholder="Phone Number">
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Buttons -->
                            <div class="card-footer text-right">
                                <button type="submit" class="btn btn-primary">Update Profile</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Scripts -->
<script th:src="@{/assets/bundles/lib.vendor.bundle.js}"></script>
<script th:src="@{/assets/js/core.js}"></script>
</body>
</html>
