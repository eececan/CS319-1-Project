<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guide Schedule</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            text-align: center;
            border: 1px solid #ddd;
            padding: 10px;
        }
        td {
            cursor: pointer;
        }
        .full {
            background-color: blue;
            color: white;
        }
        .empty {
            background-color: white;
            color: black;
        }
    </style>
    <script>
        function toggleSlot(element) {
            const currentStatus = element.getAttribute('data-status');
            const guideId = element.getAttribute('data-guide-id');
            const position = element.getAttribute('data-position');
            let newStatus = currentStatus === 'e' ? 'f' : 'e';  // Toggle status between 'e' and 'f'

            // Update the slot's visual appearance based on its new status
            if (newStatus === 'e') {
                element.classList.remove('full');
                element.classList.add('empty');
            } else {
                element.classList.remove('empty');
                element.classList.add('full');
            }

            // Send the new status to the server
            const formData = new FormData();
            formData.append('guideId', guideId);
            formData.append('position', position);
            formData.append('status', newStatus);  // Send 'e' or 'f' as a string

            fetch('/updateSchedule', {
                method: 'POST',
                body: formData
            })
                .then(response => response.text())
                .then(html => {
                    // Update the status attribute to reflect the new status
                    element.setAttribute('data-status', newStatus);
                })
                .catch(() => alert("Failed to update schedule"));
        }

        // On load function to check the initial status of the slots
        function initializeSchedule() {
            // Get all the td elements that have data-status attributes
            const slots = document.querySelectorAll('td[data-status]');
            slots.forEach(slot => {
                const currentStatus = slot.getAttribute('data-status');
                if (currentStatus === 'f') {
                    slot.classList.add('full');
                    slot.classList.remove('empty');
                } else {
                    slot.classList.add('empty');
                    slot.classList.remove('full');
                }
            });
        }
        window.onload = initializeSchedule;
    </script>
</head>
<body>
<h1>Guide Schedule</h1>
<table>
    <thead>
    <tr>
        <th>Time Slots</th>
        <th>Monday</th>
        <th>Tuesday</th>
        <th>Wednesday</th>
        <th>Thursday</th>
        <th>Friday</th>
        <th>Saturday</th>
        <th>Sunday</th>
    </tr>
    </thead>
    <tbody>
    <tr>
        <td>NINE</td>
        <td th:each="i : ${#numbers.sequence(0, 6)}"
            th:class="${guide.schedule.charAt(i) == 'f' ? 'full' : 'empty'}"
            th:data-guide-id="${guide.id}"
            th:data-position="${i}"
            th:data-status="${guide.schedule.charAt(i)}"
            th:onclick="|toggleSlot(this)|">
        </td>
    </tr>
    <tr>
        <td>ELEVEN</td>
        <td th:each="i : ${#numbers.sequence(7, 13)}"
            th:class="${guide.schedule.charAt(i) == 'f' ? 'full' : 'empty'}"
            th:data-guide-id="${guide.id}"
            th:data-position="${i}"
            th:data-status="${guide.schedule.charAt(i)}"
            th:onclick="|toggleSlot(this)|">
        </td>
    </tr>
    <tr>
        <td>THIRTEEN_THIRTY</td>
        <td th:each="i : ${#numbers.sequence(14, 20)}"
            th:class="${guide.schedule.charAt(i) == 'f' ? 'full' : 'empty'}"
            th:data-guide-id="${guide.id}"
            th:data-position="${i}"
            th:data-status="${guide.schedule.charAt(i)}"
            th:onclick="|toggleSlot(this)|">
        </td>
    </tr>
    <tr>
        <td>SIXTEEN</td>
        <td th:each="i : ${#numbers.sequence(21, 27)}"
            th:class="${guide.schedule.charAt(i) == 'f' ? 'full' : 'empty'}"
            th:data-guide-id="${guide.id}"
            th:data-position="${i}"
            th:data-status="${guide.schedule.charAt(i)}"
            th:onclick="|toggleSlot(this)|">
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
