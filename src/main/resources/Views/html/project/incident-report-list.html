<!doctype html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <style>
        .signout-link {
            color: white; /* Match navbar background */
            text-decoration: none; /* Remove underline */
            margin-left: 15px; /* Add space from notification icon */
            font-size: 16px; /* Adjust text size for better appearance */
            display: flex; /* Ensures proper alignment */
            align-items: center; /* Align icon and text vertically */
        }

        .signout-link:hover {
            color: #007bff; /* Change to primary blue on hover */
            text-decoration: underline; /* Add underline on hover */
        }
        .task-completed {
            text-decoration: line-through;
            color: gray;
        }
        /* Form Wrapper */
        .status-form {
            display: inline-block;
            margin: 0;
            padding: 0;
        }
        .table tbody tr {
            vertical-align: middle;
        }
        /* Dropdown Container */
        .status-dropdown-wrapper {
            position: relative;
            display: inline-block;
        }

        /* Styled Dropdown */
        .status-dropdown {
            appearance: none; /* Remove default dropdown styles */
            -webkit-appearance: none; /* Safari */
            -moz-appearance: none; /* Firefox */
            padding: 5px 26px;
            padding-left: 8px;
            font-size: 14px;
            font-weight: 500;
            border: 1px solid #d1d5db;
            border-radius: 16px;
            cursor: pointer;
            background-color: #f1f5f9;
            color: #333;
            text-align: left;
            transition: all 0.2s ease;
        }

        /* Hover and Focus Effects */
        .status-dropdown:hover,
        .status-dropdown:focus {
            border-color: #6c757d;
            background-color: #e2e6ea;
        }

        /* Optional: Add a dropdown arrow icon */
        .status-dropdown-wrapper::after {
            content: "▼";
            font-size: 12px;
            color: #6c757d;
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
        }

        /* Option Styles */
        .status-dropdown option {
            padding: 10px;
            font-size: 14px;
        }

        /* Specific Colors for Each Status */
        .status-dropdown option[value="new_issue"] {
            color: #fd5555; /* Red */
        }

        .status-dropdown option[value="investigating"] {
            color: #e39200; /* Orange */
        }

        .status-dropdown option[value="resolved"] {
            color: #21c346; /* Green */
        }

    </style>

    <link rel="icon" href="favicon.ico" type="image/x-icon"/>
    <!-- Bootstrap Core and vendor -->
    <link th:href="@{/assets/plugins/bootstrap/css/bootstrap.min.css}" rel="stylesheet"  >

    <!-- Plugins css -->
    <link  th:href="@{/assets/plugins/charts-c3/c3.min.css}"  rel="stylesheet">

    <!-- Core css -->
    <link th:href="@{/assets/css/main.css}" rel="stylesheet">
    <link th:href="@{/assets/css/theme1.css}" rel="stylesheet" >
</head>

<body class="font-montserrat offcanvas-active">
<!-- Page Loader -->
<div class="page-loader-wrapper">
    <div class="loader">
    </div>
</div>

<div id="main_content">

    <div id="header_top" class="header_top">
        <div class="container">
            <div class="hleft">
                <div class="dropdown">
                    <img class="avatar" th:src="@{/bilkent.png}" alt="User Avatar"
                         style="width: 40px; height: 40px; border-radius: 50%; margin-top:5px;">
                </div>
            </div>
            <div class="hright">
                <div class="dropdown">
                    <a href="javascript:void(0)" class="nav-link icon menu_toggle"><i class="fa  fa-align-left"></i></a>
                </div>
            </div>
        </div>
    </div>

    <div id="left-sidebar" class="sidebar ">
        <h5 class="brand-name"
            style="font-weight: bold; margin-left: 5px; font-size: 18px; margin-top: 10px;">
            <span th:if="${role == 'ROLE_GUIDE'}">Guide</span>
            <span th:if="${role == 'ROLE_GUIDE_IN_TRAINING'}">Guide in Training</span>
            <span th:if="${role == 'ROLE_ADVISOR'}">Advisor</span>
            <span th:if="${role == 'ROLE_COORDINATOR'}">Coordinator</span>
            <span th:if="${role == 'ROLE_HEAD_SECRETARY'}">Head Secretary</span>
            <span th:if="${role == 'ROLE_DIRECTOR'}">Director</span>
        </h5>

        <nav id="left-sidebar-nav" class="sidebar-nav">
            <ul class="metismenu">
                <li class="g_heading"></li>
                <li class="active">
                    <a th:href="@{/dashboard}">
                        <i class="fa fa-dashboard"></i><span>Dashboard</span>
                    </a>
                </li>
                <li>
                    <a th:href="@{/getAllUsers}">
                        <i class="fa fa-user"></i><span>Members</span>
                    </a>
                </li>
                <li>
                <li>
                    <a th:href="@{/getIncidentReports}">
                        <i class="fa fa-user"></i><span>Incident Reports</span>
                    </a>
                <li>
                    <a th:href="@{/ui/task/todo}">
                        <i class="fa fa-check-square-o"></i><span>Todo List</span>
                    </a>
                </li>
                <li>
                    <a th:href="@{/calendar}">
                        <i class="fa fa-calendar"></i><span>Calendar</span>
                    </a>
                </li>
                <li>
                    <a th:href="@{/ui/UserProfile/profile}">
                        <i class="fa fa-user"></i><span>My profile</span>
                    </a>
                </li>
            </ul>
        </nav>
    </div>

    <div class="page">
        <div id="page_top" class="section-body top_dark">
            <div class="container-fluid">
                <div class="page-header">
                    <div class="left">
                        <a href="javascript:void(0)" class="icon menu_toggle mr-3"><i class="fa  fa-align-left"></i></a>
                        <h1 class="page-title">Incident Reports</h1>

                    </div>
                    <div class="right">
                        <a class="signout-link" th:href="@{/ui/auth/logout}">
                            <i class="fa fa-sign-out"></i> Sign Out
                        </a>
                    </div>
                </div>
            </div>
        </div>
        <div id="main_content1">
            <div class="section-body">
                <div class="container-fluid">
                    <div class="d-flex justify-content-between align-items-center">
                        <ul class="nav nav-tabs page-header-tab">
                            <li class="nav-item">
                                <a class="nav-link" data-toggle="tab" href="#inc-list"
                                   th:classappend="${role != 'ROLE_GUIDE' and role != 'ROLE_GUIDE_IN_TRAINING'} ? 'active' : ''"
                                   th:if="${role != 'ROLE_GUIDE' and role != 'ROLE_GUIDE_IN_TRAINING'}">
                                    Incident Reports
                                </a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" data-toggle="tab" href="#inc-add"
                                   th:classappend="${role == 'ROLE_GUIDE' or role == 'ROLE_GUIDE_IN_TRAINING'} ? 'active' : ''"
                                    th:if="${role == 'ROLE_GUIDE' or role == 'ROLE_GUIDE_IN_TRAINING'}">
                                    Add Incident Report
                                </a>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>

            <div class="section-body mt-3">
                <div class="container-fluid">
                    <div class="tab-content">
                        <!-- Incident Report List -->
                        <div class="tab-pane fade show active" id="inc-list" role="tabpanel" th:if="${role != 'ROLE_GUIDE' and role != 'ROLE_GUIDE_IN_TRAINING'}">
                            <div class="card">
                                <div class="card-body">
                                    <table class="table table-hover">
                                        <thead>
                                        <tr>
                                            <th>Title</th>
                                            <th>Description</th>
                                            <th>Author</th>
                                            <th>Status</th>
                                        </tr>
                                        </thead>
                                        <tbody>
                                        <tr th:each="report : ${all_reports}">
                                            <td th:text="${report.title}"></td>
                                            <td th:text="${report.description}"></td>
                                            <td th:text="${report.author}"></td>
                                            <td>
                                                <div th:if="${report.status == 'resolved'}">
                                                    <span>Resolved ✔</span>
                                                </div>
                                                <form th:if="${report.status != 'resolved'}" th:action="@{/setIncidentReportStatus}" method="post" class="status-form">
                                                    <input type="hidden" name="id" th:value="${report.id}" />
                                                    <div class="status-dropdown-wrapper">
                                                        <select class="status-dropdown" name="status" onchange="this.form.submit()">
                                                            <option value="new_issue" th:selected="${report.status == 'new_issue'}">New Issue</option>
                                                            <option value="investigating" th:selected="${report.status == 'investigating'}">Investigating</option>
                                                            <option value="resolved" th:selected="${report.status == 'resolved'}">Resolved</option>
                                                        </select>
                                                    </div>
                                                </form>
                                            </td>
                                        </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>

                        <!-- Add Incident -->
                        <div class="tab-pane fade show active" id="inc-add" role="tabpanel" th:if="${role == 'ROLE_GUIDE' or role == 'ROLE_GUIDE_IN_TRAINING'}">
                            <div class="card">
                                <div class="card-header">
                                    <h3 class="card-title">Add Incident</h3>
                                    <div class="card-options">
                                        <a href="#" class="card-options-collapse" data-toggle="card-collapse"><i class="fe fe-chevron-up"></i></a>
                                    </div>
                                </div>
                                <form th:action="@{/postIncidentReport}" method="post" class="card-body">
                                    <div class="form-group row">
                                        <label class="col-md-3 col-form-label">Incident Title <span class="text-danger">*</span></label>
                                        <div class="col-md-7">
                                            <input type="text" class="form-control" name="title" required>
                                        </div>
                                        <label class="col-md-3 col-form-label">Author <span class="text-danger">*</span></label>
                                        <div class="col-md-7">
                                            <input type="text" class="form-control" name="author" required>
                                        </div>
                                    </div>
                                    <div class="form-group row">
                                        <label class="col-md-3 col-form-label">Incident Description <span class="text-danger">*</span></label>
                                        <div class="col-md-7">
                                            <textarea rows="4" class="form-control no-resize" name="description" placeholder="Please type what you want to report..." required></textarea>
                                        </div>
                                    </div>
                                    <div class="form-group row">
                                        <label class="col-md-3 col-form-label"></label>
                                        <div class="col-md-7">
                                            <button type="submit" class="btn btn-primary">Submit</button>
                                            <button type="button" class="btn btn-outline-secondary" onclick="window.location.href='/getIncidentReports'">Cancel</button>
                                        </div>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script th:src="@{/assets/bundles/lib.vendor.bundle.js}"></script>
<script th:src="@{/assets/bundles/apexcharts.bundle.js}"></script>
<!-- <script th:src="@{/assets/bundles/counterup.bundle.js}"></script> -->
<script th:src="@{/assets/bundles/knobjs.bundle.js}"></script>
<script th:src="@{/assets/bundles/c3.bundle.js}"></script>
<script th:src="@{/assets/js/core.js}"></script>
<script th:src="@{/assets/js/page/project-index.js}"></script>
<script>


</script>
</body>
</html>
