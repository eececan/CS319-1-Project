<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Change Password</title>
    <!-- Bootstrap CSS -->
    <link th:href="@{/assets/plugins/bootstrap/css/bootstrap.min.css}" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }

        .card {
            border: none;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 20px;
        }

        .card-header {
            background-color: white;
            color: black;
            font-size: 1.5rem;
            text-align: center;
            font-weight: bold;
            border-radius: 20px 20px 0 0;
            border-bottom: 1px solid #ddd;
        }

        .btn-primary {
            width: 100%;
            background-color: #007bff;
            border: none;
            border-radius: 10px;
        }

        .btn-primary:hover {
            background-color: #0056b3;
        }

        .form-control:focus {
            box-shadow: 0 0 5px rgba(0, 123, 255, 0.5);
        }

        /* Force Success Alert to Green */
        .alert-success {
            background-color: #28a745 !important;
            color: #fff !important;
            border-color: #28a745 !important;
        }

        /* Close Button for Green Alerts */
        .alert-success .btn-close {
            color: #fff;
            opacity: 1;
            filter: invert(1); /* Makes the close button white */
        }
    </style>

</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card">
                <div class="card-header">Change Password</div>
                <div class="card-body p-4">
                    <!-- Success Message -->
                    <div th:if="${successMessage != null and successMessage != ''}"
                         class="alert alert-success alert-dismissible fade show" role="alert">
                        <span th:text="${successMessage}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                    <!-- Error Message -->
                    <div th:if="${errorMessage != null and errorMessage != ''}"
                         class="alert alert-danger alert-dismissible fade show" role="alert">
                        <span th:text="${errorMessage}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>

                    <form th:action="@{/ui/UserProfile/changePasswordBackend}" method="post">
                        <div class="form-group mb-3">
                            <label for="newPassword1" class="form-label">New Password</label>
                            <input
                                    type="password"
                                    class="form-control"
                                    id="newPassword1"
                                    name="newPassword1"
                                    placeholder="Enter new password"
                                    required
                            />
                        </div>
                        <div class="form-group mb-4">
                            <label for="newPassword2" class="form-label">Confirm New Password</label>
                            <input
                                    type="password"
                                    class="form-control"
                                    id="newPassword2"
                                    name="newPassword2"
                                    placeholder="Confirm new password"
                                    required
                            />
                        </div>
                        <button type="submit" class="btn btn-primary">Change Password</button>
                    </form>

                </div>
            </div>
        </div>
    </div>
</div>
<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
