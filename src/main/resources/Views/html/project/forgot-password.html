<!doctype html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bilkent Guides</title>

    <!-- Bootstrap Core -->
    <link rel="stylesheet" th:href="@{/assets/plugins/bootstrap/css/bootstrap.min.css}" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <!-- Custom CSS -->
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f5f5f5;
            font-family: Arial, sans-serif;
            padding-top: 60px;
        }

        .navbar {
            width: 100%;
            height: 50px;
            background-color: #033362;
            position: fixed;
            top: 0;
            left: 0;
            display: flex;
        }

        .navbar h1 {
            margin: 0;
            font-size: 20px;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
        }

        .auth {
            width: 100%;
            max-width: 450px;
            text-align: center;
            padding-top: 20px;
        }

        .header_h1 {
            position: relative;
            top: -5px;
            margin: 20px 0;
            font-size: 24px;
            color: #2b2d30;
            text-align: center;
        }

        .icon-container {
            position: absolute;
            top: 75px;
            left: 50%;
            transform: translateX(-50%);
            width: 140px;
            height: 140px;
            background-color: #ffffff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
        }

        .icon-container img {
            width: 130px;
            height: 130px;
            object-fit: cover;
        }

        .card {
            position: relative;
            width: 100%;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 10px;
            background-color: #ffffff;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            margin-top: 20px;
        }

        .form-control {
            border-radius: 5px;
            margin-bottom: 15px;
        }

        .form-footer {
            margin-top: 20px;
        }

        .btn-primary {
            background-color: #033362;
            border-color: #033362;
        }

        .btn-primary:hover {
            background-color: #021e2b;
            border-color: #021e2b;
        }

        .form-label a {
            color: #007bff;
            text-decoration: none;
        }

        .form-label a:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .navbar h1 {
                font-size: 18px;
            }

            .header_h1 {
                font-size: 20px;
            }

            .icon-container {
                width: 120px;
                height: 120px;
            }

            .icon-container img {
                width: 110px;
                height: 110px;
            }

            .auth {
                padding-top: 100px;
            }
        }
    </style>
</head>
<body class="font-montserrat">

<!-- Navbar -->
<div class="navbar">
    <h1>Bilkent Information Office</h1>
</div>

<!-- Auth Section -->
<div class="auth">
    <!-- Welcome Header -->
    <div class="header_h1">Forgot Password</div>

    <!-- Icon Container -->
    <div class="icon-container">
        <img th:src="@{/bilkent.png}" alt="Bilkent Icon">
    </div>

    <!-- Card with Reset Password Form -->
    <div class="card">
        <div class="card-body">
            <!-- Instruction Text -->
            <div class="form-group">
                <p>Please enter your email address. Your new password will be sent to you.</p>
            </div>
            <div th:if="${errorMessage != null and errorMessage != ''}"
                 class="alert alert-danger alert-dismissible fade show" role="alert">
                <span th:text="${errorMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            <form th:action="@{/ui/auth/forgotPassword}" method="get">
                <div class="form-group">
                    <input type="email" name="email" class="form-control" placeholder="Enter email" required>
                </div>
                <!-- Back to Sign In Link -->
                <div class="form-label">
                    <a th:href="@{/ui/auth/login}" style="text-decoration: underline; cursor: pointer;">Turn back to Log in page</a>
                </div>
                <div class="form-footer">
                    <button type="submit" class="btn btn-primary btn-block">Send Password</button>
                </div>
            </form>

        </div>
    </div>

</div>

<script th:src="@{/assets/bundles/lib.vendor.bundle.js}"></script>
<script th:src="@{/assets/js/core.js}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>


</body>
</html>
