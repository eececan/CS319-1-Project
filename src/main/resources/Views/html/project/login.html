<!doctype html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bilkent Information Office</title>

    <!-- Bootstrap Core -->
    <link rel="stylesheet" th:href="@{/assets/plugins/bootstrap/css/bootstrap.min.css}" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <!-- Custom CSS -->
    <style>
        body {
            height: 100vh;
            display: flex;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Montserrat', sans-serif; /* Ensure font is applied */
        }
        .auth-container {
            display: flex;
            width: 100%;
            height: 100%;
        }
        .auth-left {
            background-color: #031961; /* Blue color */
            width: 35%;
            display: flex;
            align-items: center;
            justify-content: flex-end;
        }
        .auth-right {
            background-color: #ffffff;
            width: 65%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .auth-right img.background-image {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 100%;
            object-fit: cover;
            z-index: -1; /* Ensure the background image is behind the login card */
        }
        .login-card {
            width: 450px;
            background-color: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            position: absolute;
            left: 310px;
            z-index: 1; /* Ensure the card is above the background image */
        }
        .login-card h3 {
            color: #333;
        }
        .form-control {
            margin-bottom: 15px;
        }
        .btn-primary {
            background-color: #007bff;
            border: none;
        }
        .btn-primary:hover {
            background-color: #0056b3;
        }
        .forgot-password {
            text-align: right;
            color: #555;
            margin-top: -10px;
            margin-bottom: 15px;
        }
        .logo-image {
            max-width: 100px;
            height: 100px;
            margin-bottom: 18px;
        }
        .auth-right img.background-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover; /* Ensures the image scales to cover the entire container */
            z-index: 0; /* Keep the image behind other elements */
        }
    </style>
</head>
<body>
<div class="auth-container">
    <!-- Left side (Blue Section) -->
    <div class="auth-left">
        <div class="login-card">
            <div class="text-center">
                <img src="/bilkent.png" alt="Bilkent Logo" class="logo-image">
            </div>
            <h3 class="mb-4 text-center">Login to your account</h3>
            <form action="/ui/auth/login" method="post">
                <div class="form-group">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" name="username" class="form-control" id="username" placeholder="Enter your username" required>
                </div>
                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" id="password" placeholder="Enter your password" required>
                </div>
                <div class="forgot-password">
                    <a href="forgot-password.html" class="float-right small">I forgot my password</a>
                </div>
                <div class="form-footer">
                    <button type="submit" class="btn btn-primary btn-block w-100">Log in</button>
                </div>
            </form>
        </div>
    </div>
    <div class="auth-right">
        <img src="/bilkent_pic.png" alt="Background Image" class="background-image">
    </div>
</div>
<script src="../assets/bundles/lib.vendor.bundle.js"></script>
<script src="../assets/js/core.js"></script>
</body>
</html>
