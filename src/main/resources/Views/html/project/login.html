<!doctype html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bilkent Information Office</title>

    <!-- Bootstrap Core -->
    <link rel="stylesheet" th:href="@{/assets/plugins/bootstrap/css/bootstrap.min.css}" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <!-- Custom CSS -->
    <style>
        body {
            height: 100vh;
            display: flex;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        .auth-container {
            display: flex;
            width: 100%;
            height: 100%;
        }
        .auth-left {
            background-color: #031961; /* Blue color 0d3b66 */
            width: 35%;
            display: flex;
            align-items: center;
            justify-content: flex-end;
        }
        .auth-right {
            background-color: #ffffff;
            width: 65%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            position: absolute;
            left: -30px;
            transform: translateX(-50%);
            width: 450px; /* Increased from 350px to 450px */
            background-color: #ffffff;
            padding: 30px; /* Increased padding for larger container */
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .login-card h3 {
            color: #333;
        }
        .form-control {
            margin-bottom: 15px;
        }
        .btn-primary {
            background-color: #007bff;
            border: none;
        }
        .btn-primary:hover {
            background-color: #0056b3;
        }
        .forgot-password {
            text-align: right;
            color: #555;
            margin-top: -10px;
            margin-bottom: 15px;
        }
        .auth-right img {
            position: absolute;
            right: 0; /* Align to the right */
            height: 100%; /* Cover the right section */
            width: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body class="font-montserrat">
<div class="auth-container">
    <!-- Left side (Blue Section) -->
    <div class="auth-left"></div>

    <!-- Right side (Image Section) -->
    <div class="auth-right">
        <!-- Add your background image here -->
        <img src="/bilkent_pic.png" alt="Background Image">
        <!-- Login Card positioned between blue and image sections -->
        <div class="login-card">
            <h3 class="mb-4 text-center">Login to your account</h3>
            <form action="/ui/auth/login" method="post">
                <div class="form-group">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" name="username" class="form-control" id="username" placeholder="Enter your username" required>
                </div>
                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" id="password" placeholder="Enter your password" required>
                </div>
                <div class="forgot-password">
                    <a href="forgot-password.html" class="float-right small">I forgot my password</a>
                </div>
                <div class="form-footer">
                    <button type="submit" class="btn btn-primary btn-block w-100">Log in</button>
                </div>
            </form>
        </div>
    </div>
</div>
<script src="../assets/bundles/lib.vendor.bundle.js"></script>
<script src="../assets/js/core.js"></script>
</body>
</html>
