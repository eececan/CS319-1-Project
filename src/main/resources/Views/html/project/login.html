<!doctype html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bilkent Guides</title>

    <!-- Bootstrap Core -->
    <link rel="stylesheet" href="../assets/plugins/bootstrap/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <!-- Custom CSS -->
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f5f5f5; /* Optional background */
            font-family: Arial, sans-serif;
            padding-top: 60px; /* Space for the navbar */
        }

        /* Navbar Styling */
        .navbar {
            width: 100%;
            height: 50px;
            background-color: #033362; /* Navy color */
            position: fixed;
            top: 0;
            left: 0;
            display: flex;


        }

        .navbar h1 {
            margin: 0;
            font-size: 20px;
            color: white;
            font-family: Arial, Helvetica, sans-serif;

        }

        /* Auth Section */
        .auth {
            width: 100%;
            max-width: 450px;

            text-align: center;
            padding-top: 20px; /* Add padding to avoid overlap with navbar */
        }

        /* Welcome Header */
        .header_h1 {
            position: relative;
            top: 60px; /* Adjust to bring the icon closer to the form */
            margin: 20px 0;
            font-size: 24px;
            color: #2b2d30;
            text-align: center;  /* Ensures text is centered horizontally */
        }

        /* Icon container for Bilkent icon */
        .icon-container {
            position: absolute;
            top: 75px; /* Adjust to bring the icon closer to the form */
            left: 50%;
            transform: translateX(-50%);
            width: 140px;
            height: 140px;
            background-color: #ffffff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
        }

        .icon-container img {
            width: 130px;
            height: 130px;
            object-fit: cover;
        }

        /* Card Styling */
        .card {
            position: relative;
            width: 100%;
            top: 5px; /* Adjust to bring the icon closer to the form */
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 10px;
            background-color: #ffffff;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            margin-top: 80px; /* Give space for the icon */
        }
        .btn-primary {
            background-color: #033362;
            border-color: #033362;
        }

        .btn-primary:hover {
            background-color: #021e2b;
            border-color: #021e2b;
        }

    </style>
</head>
<body class="font-montserrat">

<!-- Navbar -->
<div class="navbar">
    <h1>Bilkent Information Office</h1>
</div>

<!-- Auth Section -->
<div class="auth">
    <!-- Welcome Header -->
    <div class="header_h1">Welcome to Bilkent Information Office Management System</div>

    <!-- Icon Container -->
    <div class="icon-container">
        <img src="/bilkent.png" alt="Bilkent Icon">
    </div>

    <!-- Card with Login Form -->
    <div class="card">
        <div class="card-body">
            <div class="card-title">Login to your account</div>
            <div class="form-group">
                <input type="email" class="form-control" id="exampleInputEmail1" placeholder="Enter email">
            </div>
            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" id="exampleInputPassword1" placeholder="Password">
            </div>
            <div class="form-label">
                <label class="form-label"></label>
                <a href="forgot-password.html" class="float-right small">I forgot password</a>
            </div>
            <div class="form-footer">
                <a href="Guide-taskboard.html" class="btn btn-primary btn-block">Log in</a>
            </div>
        </div>
    </div>
</div>

<script src="../assets/bundles/lib.vendor.bundle.js"></script>
<script src="../assets/js/core.js"></script>
</body>
</html>
