<!doctype html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bilkent Guides</title>

    <!-- Bootstrap Core -->
    <link rel="stylesheet" href="../assets/plugins/bootstrap/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <!-- Custom CSS -->
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f5f5f5; /* Optional background */
            font-family: Arial, sans-serif;
            padding-top: 60px; /* Space for the navbar */
        }

        /* Navbar Styling */
        .navbar {
            width: 100%;
            height: 50px;
            background-color: #033362; /* Navy color */
            position: fixed;
            top: 0;
            left: 0;
            display: flex;


        }

        .navbar h1 {
            margin: 0;
            font-size: 20px;
            color: white;
            font-family: Arial, Helvetica, sans-serif;

        }

        /* Auth Section */
        .auth {
            width: 100%;
            max-width: 450px;

            text-align: center;
            padding-top: 20px; /* Add padding to avoid overlap with navbar */
        }

        /* forgot pass Header */
        .header_h1 {
            position: relative;
            top: -5px; /* Adjust to bring the icon closer to the form */
            margin: 20px 0;
            font-size: 24px;
            color: #2b2d30;
            text-align: center;  /* Ensures text is centered horizontally */
        }

        /* Icon container for Bilkent icon */
        .icon-container {
            position: absolute;
            top: 75px; /* Adjust to bring the icon closer to the form */
            left: 50%;
            transform: translateX(-50%);
            width: 140px;
            height: 140px;
            background-color: #ffffff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
        }

        .icon-container img {
            width: 130px;
            height: 130px;
            object-fit: cover;
        }

        /* Card Styling */
        .card {
            position: relative;
            width: 100%;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 10px;
            background-color: #ffffff;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            margin-top: 20px; /* Give space for the icon */
        }

        /* Form Input Styling */
        .form-control {
            border-radius: 5px;
            margin-bottom: 15px;
        }

        /* Form Footer and Button */
        .form-footer {
            margin-top: 20px;
        }

        .btn-primary {
            background-color: #033362;
            border-color: #033362;
        }

        .btn-primary:hover {
            background-color: #021e2b;
            border-color: #021e2b;
        }

        /* Forgot Password Link */
        .form-label a {
            color: #007bff;
            text-decoration: none;
        }

        /* Adjust text link on hover */
        .form-label a:hover {
            text-decoration: underline;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .navbar h1 {
                font-size: 18px;
            }

            .header_h1 {
                font-size: 20px;
            }

            .icon-container {
                width: 120px;
                height: 120px;
            }

            .icon-container img {
                width: 110px;
                height: 110px;
            }

            .auth {
                padding-top: 100px; /* Space for the navbar */
            }
        }
    </style>
</head>
<body class="font-montserrat">

<!-- Navbar -->
<div class="navbar">
    <h1>Bilkent Information Office</h1>
</div>

<!-- Auth Section -->
<div class="auth">
    <!-- Welcome Header -->
    <div class="header_h1">Forgot Password</div>

    <!-- Icon Container -->
    <div class="icon-container">
        <img src="bilkent.png" alt="Bilkent Icon">
    </div>

    <!-- Card with Reset Password Form -->
    <div class="card">
        <div class="card-body">
            <!-- Instruction Text -->
            <div class="form-group">
                <p>Enter your email address. Your password will be reset.</p>
            </div>

            <!-- Email Input -->
            <div class="form-group">
                <input type="email" class="form-control" id="exampleInputEmail1" placeholder="Enter email">
            </div>

            <!-- Back to Sign In Link -->
            <div class="form-label">
                Turn back to <a href="login.html">Log in</a> page
            </div>

            <!-- Submit Button -->
            <div class="form-footer">
                <a href="index.html" class="btn btn-primary btn-block">Reset Password</a>
            </div>
        </div>
    </div>
</div>

<script src="../assets/bundles/lib.vendor.bundle.js"></script>
<script src="../assets/js/core.js"></script>

</body>
</html>
